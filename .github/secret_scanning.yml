# Secret scanning and push protection skip Copycraft's synthetic test data: it holds documented
# example and test values on purpose (AWS AKIAIOSFODNN7EXAMPLE, Stripe's documentation test key,
# the jwt.io example token, a fake private-key block, credentials in a URL), so Copycraft's
# sensitivity labels can be tried. None of them is a real secret.
paths-ignore:
  - "apps/copycraft/testdata/sensitivity/**"
  - "apps/copycraft/testdata/convert/jwt.txt"
  - "apps/copycraft/testdata/detect/link_userinfo.txt"
