name: Release Copycraft

permissions:
  contents: write

on:
  push:
    tags:
      - "copycraft-v*"

env:
  CARGO_TERM_COLOR: always
  # Pinned runner image: macos-26 (arm64). Xcode path as listed in the image README
  # (actions/runner-images, macos-26-arm64), also printed by the "Select Xcode" step.
  XCODE_VERSION: "26.6"
  APP_NAME: Copycraft
  PKG: copycraft
  APP_DIR: apps/copycraft
  ENTITLEMENTS: apps/copycraft/assets/entitlements.plist
  # cargo-bundle run inside apps/copycraft writes to the WORKSPACE ROOT target/
  BUNDLE_DIR: target/aarch64-apple-darwin/release/bundle

jobs:
  # Same gate as ci.yml: a tag on a commit that fails fmt, clippy or tests publishes nothing.
  check:
    name: fmt, clippy, test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  build:
    name: Build Copycraft DMG
    needs: check
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Resolve version from tag
        run: |
          VERSION="${GITHUB_REF_NAME#copycraft-v}"
          CARGO_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "copycraft") | .version')
          echo "Tag version: $VERSION / Cargo.toml version: $CARGO_VERSION"
          if [ "$VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match copycraft version $CARGO_VERSION in $APP_DIR/Cargo.toml"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "APP=$BUNDLE_DIR/osx/$APP_NAME.app" >> "$GITHUB_ENV"
          echo "DMG_DIR=$BUNDLE_DIR/dmg" >> "$GITHUB_ENV"

      - name: Install cargo-bundle
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-bundle

      # cargo-bundle has no --locked flag: build once with --locked first so a stale Cargo.lock
      # fails here instead of being re-resolved; cargo bundle then reuses this build.
      - name: Build release binary (locked)
        run: cargo build --release --locked --target aarch64-apple-darwin -p "$PKG"

      - name: Build app bundle
        # Run from the package dir: cargo-bundle resolves icon/resources/
        # info_plist_exts paths relative to the current directory.
        working-directory: ${{ env.APP_DIR }}
        run: cargo bundle --release --target aarch64-apple-darwin

      - name: Copy assets into app bundle
        run: |
          RES="$APP/Contents/Resources"
          mkdir -p "$RES/assets"
          if [ -f "$APP_DIR/assets/icon.icns" ]; then
            cp -v "$APP_DIR/assets/icon.icns" "$RES/icon.icns"
          fi

          echo "=== Resources ==="
          ls -lah "$RES"
          echo "=== Assets ==="
          ls -lah "$RES/assets"

      # cargo-bundle only copies an .icns and cannot read the macOS 26 Icon Composer format.
      # This compiles the icon with actool into Assets.car + AppIcon.icns and sets
      # CFBundleIconName/CFBundleIconFile. Source: $APP_DIR/assets/AppIcon.icon, else
      # AppIcon.appiconset, else icon.icns; it skips itself when there is none. Must run before
      # signing: it changes the bundle.
      - name: Compile app icon (actool)
        run: scripts/build_app_icon.sh "$PKG" "$APP"

      - name: Verify app bundle
        run: |
          echo "=== App bundle ==="
          ls -la "$APP/Contents/"
          file "$APP/Contents/MacOS/copycraft"

      # Developer ID signing and notarization are prepared but stay off until the secrets exist
      # (README: "Developer ID-signing en notarisatie"). Without the certificate secrets the app
      # is ad-hoc signed exactly as before. Only presence is checked here, no secret values.
      - name: Detect signing secrets
        env:
          HAS_CERT: ${{ secrets.MACOS_CERT_P12 != '' && secrets.MACOS_CERT_PASSWORD != '' && secrets.MACOS_SIGN_IDENTITY != '' }}
          HAS_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' }}
          HAS_APPLE_ID: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
        run: |
          SIGNING=ad-hoc
          NOTARIZE=false
          HAS_NOTARY=false
          if [ "$HAS_API_KEY" = true ] || [ "$HAS_APPLE_ID" = true ]; then HAS_NOTARY=true; fi
          if [ "$HAS_CERT" = true ]; then
            SIGNING=developer-id
            if [ "$HAS_NOTARY" = true ]; then
              NOTARIZE=true
            else
              echo "::warning::Developer ID signing without notarytool credentials: the release is not notarized"
            fi
          elif [ "$HAS_NOTARY" = true ]; then
            echo "::warning::Notarization credentials without a Developer ID certificate: ad-hoc signing, no notarization"
          fi
          echo "Signing: $SIGNING, notarize: $NOTARIZE"
          echo "SIGNING=$SIGNING" >> "$GITHUB_ENV"
          echo "NOTARIZE=$NOTARIZE" >> "$GITHUB_ENV"

      - name: Import Developer ID certificate (temporary keychain)
        if: env.SIGNING == 'developer-id'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/import_signing_cert.sh

      # Must run after "Copy assets into app bundle" (changing the bundle after
      # signing breaks the seal) and before create-dmg. cargo-bundle cannot embed
      # entitlements, so the app is (re)signed here. Same flags as scripts/sign_app.sh.
      # No --deep: one executable, no nested frameworks/helpers.
      - name: Ad-hoc sign the app (App Sandbox entitlements, hardened runtime)
        if: env.SIGNING == 'ad-hoc'
        run: |
          plutil -lint "$ENTITLEMENTS"
          codesign --force --sign - --options runtime --entitlements "$ENTITLEMENTS" "$APP"
          codesign --verify --strict --verbose=2 "$APP"

      # Same entitlements and hardened runtime, plus a secure timestamp (KEYCHAIN comes from
      # the import step).
      - name: Developer ID sign the app (App Sandbox entitlements, hardened runtime, timestamp)
        if: env.SIGNING == 'developer-id'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
        run: scripts/sign_app.sh "$PKG" "$APP"

      - name: Verify signature and entitlements
        run: |
          echo "=== Signature ==="
          codesign -dv "$APP" 2>&1 | tee "$RUNNER_TEMP/sig.txt"
          grep -Eq '^CodeDirectory .*flags=.*runtime' "$RUNNER_TEMP/sig.txt" \
            || { echo "::error::Hardened runtime flag missing"; exit 1; }
          echo "=== Entitlements ==="
          codesign -d --entitlements - "$APP"
          codesign -d --entitlements - --xml "$APP" > "$RUNNER_TEMP/entitlements.plist"
          SANDBOX=$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.app-sandbox' "$RUNNER_TEMP/entitlements.plist")
          if [ "$SANDBOX" != "true" ]; then
            echo "::error::com.apple.security.app-sandbox is not true in the signed app"
            exit 1
          fi

      # Before the DMG is built, so the DMG holds the stapled app (also opens offline).
      - name: Notarize and staple the app
        if: env.NOTARIZE == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: scripts/notarize.sh "$APP"

      - name: Install create-dmg
        run: brew install create-dmg

      - name: Create professional DMG
        run: |
          VOLICON_ARGS=()
          if [ -f "$APP/Contents/Resources/icon.icns" ]; then
            VOLICON_ARGS=(--volicon "$APP/Contents/Resources/icon.icns")
          fi
          mkdir -p "$DMG_DIR"
          create-dmg \
            --volname "$APP_NAME" \
            "${VOLICON_ARGS[@]}" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 190 \
            --hide-extension "$APP_NAME.app" \
            --app-drop-link 450 190 \
            "$DMG_DIR/$PKG-temp.dmg" \
            "$APP"

      - name: Rename DMG with version
        run: |
          mv "$DMG_DIR/$PKG-temp.dmg" "$DMG_DIR/$PKG-$VERSION.dmg"
          ls -lah "$DMG_DIR"

      - name: Sign, notarize and staple the DMG
        if: env.SIGNING == 'developer-id'
        env:
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="$DMG_DIR/$PKG-$VERSION.dmg"
          codesign --force --sign "$MACOS_SIGN_IDENTITY" --keychain "$KEYCHAIN" --timestamp "$DMG"
          codesign --verify --strict --verbose=2 "$DMG"
          if [ "$NOTARIZE" = true ]; then
            scripts/notarize.sh "$DMG"
          fi

      - name: Verify DMG
        run: |
          file "$DMG_DIR/$PKG-$VERSION.dmg"
          hdiutil verify "$DMG_DIR/$PKG-$VERSION.dmg"

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$DMG_DIR/$PKG-$VERSION.dmg" \
            --title "$APP_NAME $VERSION" \
            --generate-notes

      - name: Release summary
        if: success()
        run: echo "✅ $APP_NAME $VERSION DMG release created! Signing $SIGNING, notarized $NOTARIZE."

      - name: Remove temporary keychain
        if: always() && env.KEYCHAIN != ''
        run: security delete-keychain "$KEYCHAIN" || true
