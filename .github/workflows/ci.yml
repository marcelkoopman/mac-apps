name: CI

# Docs-only changes skip CI. main has no required status checks; if any are added, a skipped
# workflow leaves them "expected" forever, so move these filters into the jobs then.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/LICENSE"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned runner image: macos-26 (arm64). Xcode path as listed in the image README
  # (actions/runner-images, macos-26-arm64), also printed by the "Select Xcode" step.
  XCODE_VERSION: "26.6"

jobs:
  # fmt and clippy are the same on every macOS, so they run once, on the pinned runner.
  lint:
    name: fmt, clippy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # apps/copycraft/clippy.toml also forbids std::process::Command, std::net and
      # std::os::unix::net in copycraft (clippy reads it for that crate only).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No HTTP/TLS/socket crates in copycraft's dependency tree and no osascript in its sources
      # (socket2 via polars → tokio is allowlisted, see the script).
      - name: Copycraft offline guards
        run: scripts/check_copycraft_offline.sh

  # Tests on the pinned macOS 26 runner and on macOS 15, where the pre-26 fallbacks run for real
  # (FlexiblePush instead of the Glass bezel, frosted background, plain view instead of the glass
  # group). Each runner uses its image's Xcode (keep 26.6 in step with XCODE_VERSION).
  test:
    name: test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: "26.6"
          - os: macos-15
            xcode: "16.4"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sw_vers
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace --locked

  # The release workflows compile the app icon with scripts/build_app_icon.sh. Run it here on a
  # stub bundle for each app, so a broken icon source or actool change shows up before a tag.
  app-icon:
    name: app icon (actool)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Compile the app icons into stub bundles
        run: |
          xcrun actool --version --output-format human-readable-text
          for pkg in copycraft ticker; do
            app="$RUNNER_TEMP/$pkg/Stub.app"
            mkdir -p "$app/Contents/Resources"
            plutil -create xml1 "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string $pkg" "$app/Contents/Info.plist"
            scripts/build_app_icon.sh "$pkg" "$app"
            if [ -f "$app/Contents/Resources/Assets.car" ]; then
              xcrun --sdk macosx assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/$pkg-assets.json"
              grep -q '"AppIcon"' "$RUNNER_TEMP/$pkg-assets.json" \
                || { echo "::error::$pkg Assets.car has no AppIcon"; exit 1; }
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = AppIcon
            fi
          done

  audit:
    name: Security audit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ignores live in .cargo/audit.toml at the repo root.
      - run: cargo audit
