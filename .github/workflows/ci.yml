name: CI

# Docs-only changes skip CI. main has no required status checks; if any are added, a skipped
# workflow leaves them "expected" forever, so move these filters into the jobs then.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/LICENSE"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "**/LICENSE"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Pinned runner image: macos-26 (arm64). Xcode path as listed in the image README
  # (actions/runner-images, macos-26-arm64), also printed by the "Select Xcode" step.
  XCODE_VERSION: "26.6"

jobs:
  # Real unsafe (blocks, unsafe fn, unsafe impl) in copycraft and mac-ui may only go down.
  commits:
    name: commit messages
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Conventional Commits
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            scripts/check_commits.sh "$PR_BASE" HEAD
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = 0000000000000000000000000000000000000000 ]; then
            echo "new branch: nothing to compare"
          else
            scripts/check_commits.sh "$BEFORE" "$SHA"
          fi

  unsafe-count:
    name: unsafe count
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Unsafe at or below scripts/unsafe_baseline.txt
        run: scripts/count_unsafe.sh --check

  # fmt and clippy are the same on every macOS, so they run once, on the pinned runner.
  lint:
    name: fmt, clippy
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt
        run: cargo fmt --all -- --check

      # apps/copycraft/clippy.toml also forbids std::process::Command, std::net and
      # std::os::unix::net in copycraft (clippy reads it for that crate only).
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # No HTTP/TLS/socket crates in copycraft's dependency tree, no osascript in its sources, and
      # no subprocess or network code in mac-ui (socket2 via polars → tokio is allowlisted, see
      # the script).
      - name: Copycraft offline guards
        run: scripts/check_copycraft_offline.sh

      # plutil -lint and key checks on both source manifests (the release workflows check the
      # built bundles).
      - name: Privacy manifests
        run: |
          scripts/check_privacy_manifest.sh copycraft
          scripts/check_privacy_manifest.sh ticker

  # Release profile: code under #[cfg(debug_assertions)] (or not) only compiles differently
  # here, so a debug-only binding used in release is caught before a release run.
  release-check:
    name: release check
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2

      - name: Check (release)
        run: cargo check --release --locked --workspace --all-targets

      - name: Clippy (release)
        run: cargo clippy --release --locked --workspace --all-targets -- -D warnings

  # Tests on the pinned macOS 26 runner (Xcode 26.6, keep in step with XCODE_VERSION). No macOS 15
  # runner any more: Copycraft needs macOS 26, and its binary links FoundationModels (mac-ai).
  test:
    name: test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            xcode: "26.6"
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ matrix.xcode }}
        run: |
          sw_vers
          sudo xcode-select -s "/Applications/Xcode_${{ matrix.xcode }}.app"
          xcodebuild -version

      # Version, components and target come from rust-toolchain.toml.
      - name: Install Rust (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      - name: Test
        run: cargo test --workspace --locked

      # mac-ui's log module calls the private _os_log_impl (os_log is a C macro). Write one
      # fixed line without content and read it back: nothing found means that ABI changed.
      - name: os_log round trip
        run: |
          cargo test -p mac-ui --lib --locked log::tests::os_log_round_trip -- --ignored --exact
          sleep 2
          log show --last 5m --style compact \
            --predicate 'subsystem == "com.github.marcelkoopman.mac-apps.oslog-test"' \
            | tee "$RUNNER_TEMP/oslog.txt"
          grep -q "os_log round trip 7f3a" "$RUNNER_TEMP/oslog.txt"

  # The release workflows compile the app icon with scripts/build_app_icon.sh. Run it here on a
  # stub bundle for each app, so a broken icon source or actool change shows up before a tag.
  app-icon:
    name: app icon (actool)
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app"
          xcodebuild -version

      - name: Compile the app icons into stub bundles
        run: |
          xcrun actool --version --output-format human-readable-text
          for pkg in copycraft ticker; do
            app="$RUNNER_TEMP/$pkg/Stub.app"
            mkdir -p "$app/Contents/Resources"
            plutil -create xml1 "$app/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Add :CFBundleName string $pkg" "$app/Contents/Info.plist"
            scripts/build_app_icon.sh "$pkg" "$app"
            if [ -f "$app/Contents/Resources/Assets.car" ]; then
              xcrun --sdk macosx assetutil --info "$app/Contents/Resources/Assets.car" > "$RUNNER_TEMP/$pkg-assets.json"
              grep -q '"AppIcon"' "$RUNNER_TEMP/$pkg-assets.json" \
                || { echo "::error::$pkg Assets.car has no AppIcon"; exit 1; }
              test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconFile' "$app/Contents/Info.plist")" = AppIcon
              if [ -d "apps/$pkg/assets/AccentColor.colorset" ]; then
                grep -q '"AccentColor"' "$RUNNER_TEMP/$pkg-assets.json" \
                  || { echo "::error::$pkg Assets.car has no AccentColor"; exit 1; }
                test "$(/usr/libexec/PlistBuddy -c 'Print :NSAccentColorName' "$app/Contents/Info.plist")" = AccentColor \
                  || { echo "::error::$pkg Info.plist has no NSAccentColorName = AccentColor"; exit 1; }
              fi
            fi
          done
