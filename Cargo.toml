[workspace]
members = ["apps/*", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2024"

# Dependencies shared by copycraft, ticker and mac-ui. Per-app features stay in the app manifests.
[workspace.dependencies]
arboard = "3"
polars = { version = "0.55.2", default-features = false }
serde_json = "1.0"

# UI frameworks, used only by `crates/mac-ui`; apps import them via its re-exports (`mac_ui::objc2`
# etc.). objc2-foundation/objc2-app-kit have default features off and only what mac-ui itself
# needs, so ticker does not build all of AppKit/Foundation. copycraft enables mac-ui's
# `appkit-full` feature instead. objc2* are macOS-only (mac-ui inherits them in a macOS target table).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std",
    "objc2-core-foundation",
    "NSAttributedString",
    "NSColor",
    "NSGlassEffectView",
    "NSGraphics",
    "NSImage",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSAttributedString", "NSGeometry", "NSRange", "NSString"] }
# mac-ui `notify` only: posting a notification with a completion-handler block.
block2 = { version = "0.6", default-features = false, features = ["alloc"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
    "std",
    "block2",
    "UNNotification",
    "UNNotificationContent",
    "UNNotificationRequest",
    "UNNotificationTrigger",
    "UNUserNotificationCenter",
] }
# mac-ui `file_panel` only: `UTType`s for `NSSavePanel::setAllowedContentTypes`.
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }
tray-icon = "0.26"
winit = "0.30"

# Profiles moved from apps/copycraft/Cargo.toml (Cargo ignores profiles in non-root members).
[profile.dev]
debug = "line-tables-only"
incremental = true

[profile.dev.package."*"]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[profile.dist]
inherits = "release"
strip = "symbols"
panic = "abort"
