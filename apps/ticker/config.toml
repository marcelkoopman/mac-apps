# Asset whose price is shown next to the tray icon.
# Falls back to the first asset with a valid price.
menubar_asset = "Bitcoin"

[[assets]]
name = "Bitcoin"
url = "https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=eur"
price_path = "bitcoin.eur"
unit = "EUR"
unit_hint = "/BTC"
symbol = "💰"

[[assets]]
name = "ETH"
url = "https://api.coingecko.com/api/v3/simple/price?ids=ethereum&vs_currencies=eur"
price_path = "ethereum.eur"
unit = "EUR"
unit_hint = "/ETH"
symbol = "Ξ"

[[assets]]
name = "Gold"
url = "https://xaus.com/api/v1/spot?currency=EUR"
price_path = "xau.price"
unit = "EUR"
unit_hint = "/troy oz"
symbol = "🥇"

[[assets]]
name = "Gas"
url = "https://eurooilwatch.com/api/v1/gas"
price_path = "ttf.priceEurMwh"
unit = "EUR"
unit_hint = "/MWh"
symbol = "🔥"

[[assets]]
name = "Benzine"
url = "https://eurooilwatch.com/api/v1/prices"
price_path = "countries.countryCode=NL.petrolPrice"
unit = "EUR"
unit_hint = "/L"
symbol = "⛽"

[[assets]]
name = "Diesel"
url = "https://eurooilwatch.com/api/v1/prices"
price_path = "countries.countryCode=NL.dieselPrice"
unit = "EUR"
unit_hint = "/L"
symbol = "🛢️"

[[assets]]
name = "Power NL"
url = "https://dap.xadi.eu/api/nl/today"
price_path = "data.0.price"
unit = "EUR"
unit_hint = "/kWh"
symbol = "⚡"
