[package]
name = "ticker"
version = "0.1.44"
edition.workspace = true

[package.metadata.bundle]
name = "Ticker"
identifier = "com.github.marcelkoopman.ticker"
icon = ["assets/icon.icns"]
resources = ["config.toml"]
version = "0.1.44"
category = "Utilities"
short_description = "Price Ticker"
long_description = "A menubar price ticker for Bitcoin, Gold, and TTF Gas"

[package.metadata.bundle.macos]
# Apple silicon only (aarch64-apple-darwin, whose Rust default deployment target is 11.0).
minimum_system_version = "11.0"
info_plist_exts = ["assets/Info.plist.ext"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
toml = "1.1"
chrono = "0.4"
dirs = "7.0"
# Heap profiling only (`--features dhat-heap`); not built otherwise.
dhat = { version = "0.3", optional = true }
# `dialog`: native NSAlert prompts and pickers (mac_ui::dialog). `notify`: native notifications
# (mac_ui::notify; without the app bundle ticker falls back on osascript itself, in watch_ui.rs).
mac-ui = { path = "../../crates/mac-ui", features = ["dialog", "notify"] }
arboard = { workspace = true }
# Minimal features: DataFrame + Display. Avoids polars-io/object_store → quick-xml 0.38 (RUSTSEC-2026-0194/0195).
polars = { workspace = true, features = ["fmt"] }

[features]
dhat-heap = ["dep:dhat"]
