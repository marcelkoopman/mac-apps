[package]
name = "ticker"
version = "0.1.39"
edition.workspace = true

[package.metadata.bundle]
name = "Ticker"
identifier = "com.github.marcelkoopman.ticker"
icon = ["assets/icon.icns"]
resources = ["config.toml"]
version = "0.1.39"
category = "Utilities"
short_description = "Price Ticker"
long_description = "A menubar price ticker for Bitcoin, Gold, and TTF Gas"

[package.metadata.bundle.macos]
minimum_system_version = "10.13"
info_plist_exts = ["assets/Info.plist.ext"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true }
toml = "1.1"
image = { workspace = true }
chrono = "0.4"
dirs = "7.0"
dhat = "0.3"
# `dialog`: native NSAlert prompts and pickers (mac_ui::dialog). `notify`: native notifications
# (mac_ui::notify; osascript when not run from the app bundle).
mac-ui = { path = "../../crates/mac-ui", features = ["dialog", "notify"] }
arboard = { workspace = true }
# Minimal features: DataFrame + Display. Avoids polars-io/object_store → quick-xml 0.38 (RUSTSEC-2026-0194/0195).
polars = { workspace = true, features = ["fmt"] }

[features]
dhat-heap = []
