[package]
name = "copycraft"
version = "0.1.43"
edition.workspace = true

[package.metadata.bundle]
name = "Copycraft"
identifier = "com.github.marcelkoopman.copycraft"
icon = ["assets/icon.icns"]
version = "0.1.43"
category = "Utilities"
short_description = "Clipboard transformer"
long_description = "A macOS clipboard command. A hotkey opens a card at the cursor for what you copied. The menu bar icon shows that Copycraft is running."

[package.metadata.bundle.macos]
minimum_system_version = "10.13"
info_plist_exts = ["assets/Info.plist.ext"]

[dependencies]
anyhow = "1.0.104"
arboard = { workspace = true }
base64 = "0.23"
global-hotkey = "0.8"
# Not inherited from the workspace: copycraft needs default-features = false, ticker does not.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
infer = "0.22"
leakguard = "0.9.1"
mac-ui = { path = "../../crates/mac-ui" }
polars = { workspace = true, features = ["csv", "json", "fmt", "dtype-slim", "parquet"] }
redact-core = "0.12"
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
tray-icon = { workspace = true }
winit = { workspace = true }
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2 = { workspace = true }
# "default" restores the full default feature set; the workspace entry turns defaults off for mac-ui.
objc2-foundation = { workspace = true, features = ["default", "NSString", "NSAttributedString", "NSArray", "NSDate", "NSURL", "NSURLRequest", "NSURLResponse", "NSUserDefaults", "NSData", "NSDictionary", "NSError"] }
objc2-app-kit = { workspace = true, features = [
    "default",
    "NSAnimation",
    "NSAnimationContext",
    "NSAppearance",
    "NSApplication",
    "NSBitmapImageRep",
    "NSPasteboard",
    "NSButton",
    "NSCell",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSColor",
    "NSControl",
    "NSFont",
    "NSGraphics",
    "NSImage",
    "NSImageCell",
    "NSImageRep",
    "NSImageView",
    "NSResponder",
    "NSOpenPanel",
    "NSPanel",
    "NSSavePanel",
    "NSScrollView",
    "NSText",
    "NSTextContainer",
    "NSTextStorage",
    "NSTextView",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNObservation", "VNRequest", "VNTypes"] }
