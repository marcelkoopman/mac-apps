[package]
name = "copycraft"
version = "0.1.49"
edition.workspace = true

[package.metadata.bundle]
name = "Copycraft"
identifier = "com.github.marcelkoopman.copycraft"
icon = ["assets/icon.icns"]
version = "0.1.49"
category = "Utilities"
short_description = "Clipboard transformer"
long_description = "A macOS clipboard command. A hotkey opens a card at the cursor for what you copied. The menu bar icon shows that Copycraft is running."

[package.metadata.bundle.macos]
# Apple silicon only (aarch64-apple-darwin, whose Rust default deployment target is 11.0).
minimum_system_version = "11.0"
info_plist_exts = ["assets/Info.plist.ext"]

[dependencies]
anyhow = "1.0.104"
arboard = { workspace = true }
base64 = "0.23"
global-hotkey = "0.8"
# Not inherited from the workspace: copycraft needs default-features = false, ticker does not.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
infer = "0.22"
leakguard = "0.9.1"
# `appkit-full`: all objc2-app-kit/objc2-foundation features (their defaults), as before.
# `blur`, `drop`, `file_panel`, `image`, `panel`, `progress`, `theme`, `widgets`: the
# mac_ui::blur, mac_ui::drop, mac_ui::file_panel, mac_ui::image, mac_ui::panel,
# mac_ui::progress, mac_ui::theme and mac_ui::widgets modules.
mac-ui = { path = "../../crates/mac-ui", features = ["appkit-full", "blur", "drop", "file_panel", "image", "panel", "progress", "theme", "widgets"] }
polars = { workspace = true, features = ["csv", "json", "fmt", "dtype-slim", "parquet"] }
redact-core = "0.12"
serde_json = { workspace = true, features = ["preserve_order"] }
serde_yaml = "0.9"
zeroize = "1.9.0"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNObservation", "VNRequest", "VNTypes"] }
