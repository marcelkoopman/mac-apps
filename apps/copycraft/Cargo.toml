[package]
name = "copycraft"
version = "0.1.99"
edition.workspace = true
license = "LicenseRef-Proprietary"
publish = false

[package.metadata.bundle]
name = "CopyCraft"
identifier = "nl.marcelkoopman.copycraft"
# No `icon`: cargo-bundle only copies an .icns. The bundle icon is compiled from the Icon Composer
# document assets/AppIcon.icon by scripts/build_app_icon.sh (Assets.car + AppIcon.icns with every
# size, CFBundleIconName/CFBundleIconFile = AppIcon), as in the release workflow.
# Privacy manifest: lands in Contents/Resources/PrivacyInfo.xcprivacy (like ticker's config.toml).
resources = ["PrivacyInfo.xcprivacy"]
version = "0.1.99"
category = "Utilities"
copyright = "© 2026 Marcel Koopman"
short_description = "Clipboard transformer"
long_description = "A macOS clipboard command. A hotkey opens a card at the cursor for what you copied. The menu bar icon shows that CopyCraft is running."

[package.metadata.bundle.macos]
# Apple silicon only. macOS 26 (Tahoe) or later (local AI actions use Foundation Models):
# LSMinimumSystemVersion in the bundle and the actool deployment target
# (scripts/build_app_icon.sh). .cargo/config.toml sets MACOSX_DEPLOYMENT_TARGET=26.0 for every build.
# The pre-26 fallbacks in the code are not reachable any more; they are left as they are.
minimum_system_version = "26.0"
info_plist_exts = ["assets/Info.plist.ext"]

[dependencies]
anyhow = "1.0.104"
arboard = { workspace = true }
base64 = "0.23"
global-hotkey = "0.9"
# Not inherited from the workspace: copycraft needs default-features = false, ticker does not.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
infer = "0.22"
# Word documents (src/docx.rs): inflating `word/document.xml` from the docx zip, in memory. Already
# in the tree (polars); pure Rust backend (miniz_oxide), no zlib/C. No zip crate: the zip
# directory is read by hand. Approved by Marcel (2026-10-16).
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
leakguard = "1.0.0"
memchr = "2.8"
# `appkit-full`: all objc2-app-kit/objc2-foundation features (their defaults), as before.
# `blur`, `dialog`, `drop`, `file_panel`, `image`, `panel`, `progress`, `theme`, `widgets`: the
# mac_ui::blur, mac_ui::dialog (Image ▾ › Resize › Custom…), mac_ui::drop, mac_ui::file_panel,
# mac_ui::image, mac_ui::panel, mac_ui::progress, mac_ui::theme and mac_ui::widgets modules. `notify`:
# local notifications (UserNotifications; no push, no network). No feature with network code:
# copycraft works offline (README, Privacy).
# Local AI actions on text (Apple Foundation Models, on the device; no network). All unsafe of
# that feature lives in mac-ai.
mac-ai = { path = "../../crates/mac-ai" }
mac-ui = { path = "../../crates/mac-ui", features = ["appkit-full", "blur", "dialog", "drop", "file_panel", "image", "notify", "quicklook", "panel", "progress", "screenshot", "theme", "widgets"] }
# One RegexSet for the first layer of the sensitivity check (src/recognize.rs). Already in
# the tree through polars.
regex = "1.13"
# `temporal`: reading `dd/mm/yyyy` text as dates (src/dataframe_dates.rs). No extra crates: the
# polars-time crate was already in the tree through polars-io. Not `lazy`: it pulls in
# polars-stream and with it object_store and reqwest (network crates). No `parquet`: tables are
# saved as CSV only.
polars = { workspace = true, features = ["csv", "json", "fmt", "dtype-slim", "temporal"] }
serde_json = { workspace = true, features = ["preserve_order"] }
# Text ▾ › Convert › Encoding › SHA-256 / SHA-1 / MD5 (src/text_ops/hash.rs): RustCrypto, pure Rust,
# MIT OR Apache-2.0, no network. Not the default `alloc`/`oid`; `zeroize` wipes the hasher state of
# a sensitive card. Approved by Marcel (2026-10-23).
md-5 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha1 = { version = "0.11", default-features = false, features = ["zeroize"] }
sha2 = { version = "0.11", default-features = false, features = ["zeroize"] }
# YAML (src/transform.rs): serde_norway, the maintained fork of the deprecated serde_yaml
# (whose unsafe-libyaml is unmaintained, RUSTSEC-2024-0449); same API. Approved by Marcel (2026-10-22).
serde_norway = "0.9.42"
# Line diff of two history copies (src/diff.rs). Pure Rust: no network crates.
similar = "3.2"
zeroize = "1.9.1"

[target.'cfg(target_os = "macos")'.dependencies]
dispatch2 = "0.3"
# Image ▾ (src/image_edit*.rs): decoding with EXIF orientation, resizing, rotating, flipping,
# grayscale, and encoding PNG / JPEG / HEIC without metadata, in CoreGraphics and ImageIO.
# Approved by Marcel (2026-10-03); objc2-core-foundation for the CFData/CFDictionary they take.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, features = ["std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-image-io = { version = "0.3.2", default-features = false, features = ["std", "CGImageDestination", "CGImageProperties", "CGImageSource", "objc2-core-graphics"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNRecognizeTextRequest", "VNDetectBarcodesRequest", "VNRequestHandler", "VNObservation", "VNRequest", "VNTypes"] }
# PDF card (src/macos_pdf.rs): text layer through PDFKit, pages rendered with CoreGraphics for OCR. Approved by Marcel (2026-10-15).
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "PDFDocument", "PDFPage", "objc2-core-graphics"] }
