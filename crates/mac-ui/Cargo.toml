[package]
name = "mac-ui"
version = "0.1.0"
edition.workspace = true
license = "LicenseRef-Proprietary"
publish = false

[features]
# All objc2-app-kit and objc2-foundation features (their default feature sets). The workspace
# entries turn defaults off so ticker only builds what mac-ui needs; copycraft enables this.
appkit-full = ["objc2-app-kit/default", "objc2-foundation/default"]
# `mac_ui::theme`: appearance switch stored in the user defaults.
theme = ["objc2-app-kit/NSAppearance", "objc2-app-kit/NSApplication", "objc2-foundation/NSUserDefaults"]
# `mac_ui::widgets`, `mac_ui::actions` (target/action, delayed perform: NSRunLoop, NSDate; run_on_main:
# block2, NSOperation),
# `mac_ui::button`, `mac_ui::fonts` and `mac_ui::text`: AppKit control
# constructors, the glass push button (NSBezelStyle in NSButtonCell, NSControlBorderShape in
# NSControl, NSTintProminence, accessibility labels in NSAccessibilityProtocols), font lookup and
# attributed strings (NSAttributedString, already on in the workspace entry). NSEvent and
# NSApplication are for the modifier checks in `mac_ui::keys`. `mac_ui::motion`, `mac_ui::toast`
# and `mac_ui::a11y`: NSAnimationContext groups, the Reduce Motion/Transparency settings
# (NSWorkspace), the toast window with its SF Symbol, VoiceOver announcements and custom actions
# (NSAccessibilityCustomAction with a block handler).
widgets = [
    "objc2-app-kit/block2",
    "objc2-app-kit/NSAccessibility",
    "objc2-app-kit/NSAccessibilityCustomAction",
    "objc2-app-kit/NSAccessibilityConstants",
    "objc2-app-kit/NSAccessibilityProtocols",
    "objc2-app-kit/NSAnimation",
    "objc2-app-kit/NSAnimationContext",
    "objc2-app-kit/NSColor",
    "objc2-app-kit/NSImage",
    "objc2-app-kit/NSPanel",
    # NSColor's CGColor for `fade_trailing_edge`'s gradient mask (objc2-core-graphics is already
    # in the tree through objc2-app-kit; no new crate).
    "objc2-app-kit/objc2-core-graphics",
    "objc2-app-kit/NSScreen",
    "objc2-app-kit/NSWindow",
    "objc2-app-kit/NSWorkspace",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSValue",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSBox",
    "objc2-app-kit/NSButton",
    "objc2-app-kit/NSButtonCell",
    "objc2-app-kit/NSCell",
    "objc2-app-kit/NSClipView",
    "objc2-app-kit/NSControl",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSFont",
    "objc2-app-kit/NSFontDescriptor",
    "objc2-app-kit/NSImageCell",
    "objc2-app-kit/NSImageView",
    "objc2-app-kit/NSLayoutManager",
    "objc2-app-kit/NSMenu",
    "objc2-app-kit/NSMenuItem",
    "objc2-app-kit/NSParagraphStyle",
    "objc2-app-kit/NSScrollView",
    "objc2-app-kit/NSSearchField",
    "objc2-app-kit/NSText",
    "objc2-app-kit/NSTextContainer",
    "objc2-app-kit/NSTextField",
    "objc2-app-kit/NSTextStorage",
    "objc2-app-kit/NSTextView",
    "objc2-app-kit/NSTintProminence",
    "objc2-app-kit/NSUserInterfaceItemIdentification",
    "objc2-foundation/NSDate",
    "objc2-foundation/NSRunLoop",
    "dep:block2",
    "objc2-foundation/block2",
    "objc2-foundation/NSOperation",
]
# `mac_ui::dialog`: modal NSAlert message, confirm, button choice, text prompt and list pick, plus
# the run loop mode check that defers them until a menu has closed.
dialog = [
    "objc2-app-kit/NSAccessibilityProtocols",
    "objc2-app-kit/NSAlert",
    "objc2-app-kit/NSCell",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSButton",
    "objc2-app-kit/NSControl",
    "objc2-app-kit/NSMenu",
    "objc2-app-kit/NSMenuItem",
    "objc2-app-kit/NSPopUpButton",
    "objc2-app-kit/NSTextField",
    "objc2-app-kit/NSWindow",
    "objc2-foundation/NSRunLoop",
]
# `mac_ui::panel`: borderless floating panel creation, activation and placement.
panel = [
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSEvent",
    "objc2-app-kit/NSScreen",
    "objc2-app-kit/NSWindow",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSEnumerator",
]
# `mac_ui::file_panel`: modal NSOpenPanel (choose a file) and NSSavePanel (choose a save path).
# The save panel's format popup (`choose_save_path_with_format`): NSPopUpButton and an
# NSTextField label in an NSView accessory.
file_panel = [
    "dep:objc2-uniform-type-identifiers",
    "objc2-app-kit/NSApplication",
    "objc2-app-kit/NSButton",
    "objc2-app-kit/NSControl",
    "objc2-app-kit/NSOpenPanel",
    "objc2-app-kit/NSPanel",
    "objc2-app-kit/NSPopUpButton",
    "objc2-app-kit/NSResponder",
    "objc2-app-kit/NSSavePanel",
    "objc2-app-kit/NSTextField",
    "objc2-app-kit/NSView",
    "objc2-app-kit/NSWindow",
    "objc2-app-kit/objc2-uniform-type-identifiers",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSURL",
]
# `mac_ui::drop`: a view that takes one dropped file (by uniform type, also a promised file:
# NSFilePromiseReceiver with a block2 reader on NSOperationQueue), image data or dropped text, its
# highlight (NSBox, NSColor, a VoiceOver announcement in NSAccessibility/NSAccessibilityConstants)
# and a field editor (NSText, NSTextView) that leaves drops to it.
drop = [
    "dep:block2",
    "dep:objc2-uniform-type-identifiers",
    "objc2-app-kit/block2",
    "objc2-app-kit/NSFilePromiseReceiver",
    "objc2-app-kit/NSAccessibility",
    "objc2-app-kit/NSAccessibilityConstants",
    "objc2-app-kit/NSAccessibilityProtocols",
    "objc2-app-kit/NSBox",
    "objc2-app-kit/NSDragging",
    "objc2-app-kit/NSPasteboard",
    "objc2-app-kit/NSText",
    "objc2-app-kit/NSTextView",
    "objc2-foundation/NSArray",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSOperation",
    "objc2-foundation/NSURL",
    "objc2-foundation/NSValue",
]
# `mac_ui::progress`: indeterminate spinning NSProgressIndicator (busy wheel).
progress = ["objc2-app-kit/NSAccessibilityProtocols", "objc2-app-kit/NSCell", "objc2-app-kit/NSProgressIndicator"]
# `mac_ui::blur`: a CIGaussianBlur content filter on a view.
blur = ["objc2-foundation/NSArray"]
# `mac_ui::image`: an NSImage from encoded bytes or straight RGBA8, and its pixel size.
image = ["objc2-app-kit/NSBitmapImageRep", "objc2-app-kit/NSImageRep", "objc2-foundation/NSDictionary"]
# `mac_ui::quicklook`: the first page of a document as PNG bytes through QLThumbnailGenerator
# (QuickLookThumbnailing), waited for with a timeout. The PNG comes from the CGImage through an
# NSBitmapImageRep; everything stays in memory.
quicklook = [
    "dep:block2",
    "dep:objc2-quick-look-thumbnailing",
    "objc2-app-kit/NSBitmapImageRep",
    "objc2-app-kit/NSImageRep",
    "objc2-app-kit/objc2-core-graphics",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSURL",
    "objc2-foundation/block2",
]
# `mac_ui::screenshot`: ScreenCaptureKit (linked, its classes looked up at run time: there is no
# crate for it in the tree) through block2 completion handlers; the Screen Recording permission
# and the on-screen window list (ids and bounds only) from CoreGraphics' CGWindow, bridged to
# NSArray/NSDictionary/NSNumber; the overlay (NSBezierPath, NSCursor) on borderless `panel`
# windows; the thumbnail (NSImageView through `image`, a drag with NSDraggingItem and an
# NSPasteboardItem, hidden through `widgets`' run_on_main); the app in front before the overlay
# (NSWorkspace, NSRunningApplication) is brought back after it. objc2-core-graphics and
# objc2-core-foundation are already in the tree: no new crate.
screenshot = [
    "dep:block2",
    "dep:objc2-core-foundation",
    "dep:objc2-core-graphics",
    "image",
    "panel",
    "widgets",
    "objc2-app-kit/NSBezierPath",
    "objc2-app-kit/NSBitmapImageRep",
    "objc2-app-kit/NSCursor",
    "objc2-app-kit/NSDragging",
    "objc2-app-kit/NSDraggingItem",
    "objc2-app-kit/NSDraggingSession",
    "objc2-app-kit/NSGraphics",
    "objc2-app-kit/NSImageRep",
    "objc2-app-kit/NSImageView",
    "objc2-app-kit/NSPasteboard",
    "objc2-app-kit/NSPasteboardItem",
    "objc2-app-kit/NSRunningApplication",
    "objc2-app-kit/NSWorkspace",
    "objc2-app-kit/objc2-core-graphics",
    "objc2-foundation/NSData",
    "objc2-foundation/NSDictionary",
    "objc2-foundation/NSError",
    "objc2-foundation/NSValue",
    "objc2-foundation/block2",
]
# `mac_ui::wake::observe_sleep_wake`: NSWorkspace will-sleep / did-wake notifications, delivered
# on the main operation queue through a block observer.
wake = [
    "dep:block2",
    "objc2-app-kit/NSWorkspace",
    "objc2-foundation/block2",
    "objc2-foundation/NSNotification",
    "objc2-foundation/NSOperation",
]
# `mac_ui::notify`: user notifications through the UserNotifications framework, from an app
# bundle only. No subprocess here: an app that wants a fallback without a bundle (ticker's
# osascript) keeps it itself, so feature unification never pulls it into another app.
notify = ["dep:block2", "dep:objc2-user-notifications", "objc2-foundation/NSBundle", "objc2-foundation/NSError"]

[dependencies]
# Not inherited from the workspace: default-features = false (same reason as copycraft). PNG only,
# for `icon::from_image_file`; apps that need more formats enable them on their own `image` dep.
image = { version = "0.25", default-features = false, features = ["png"] }
tray-icon = { workspace = true }
winit = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
zeroize = "1.9.1"
objc2 = { workspace = true }
# `NSArray`: `lang` reads `NSLocale::preferredLanguages()` (an array). `NSProcessInfo`: `log`
# checks the running macOS version before using the system log. Not a new crate.
objc2-foundation = { workspace = true, features = ["NSArray", "NSProcessInfo"] }
# The always-on `tray` module labels the status item button for VoiceOver.
objc2-app-kit = { workspace = true, features = [
    "NSAccessibilityProtocols",
    "NSButton",
    "NSControl",
    "NSStatusBarButton",
    "NSStatusItem",
] }
# `notify`, `drop`, `quicklook` and `wake` only.
block2 = { workspace = true, optional = true }
objc2-user-notifications = { workspace = true, optional = true }
# `quicklook` only.
objc2-quick-look-thumbnailing = { workspace = true, optional = true }
# `screenshot` only (both already in the tree through objc2-app-kit).
objc2-core-foundation = { version = "0.3.2", default-features = false, optional = true, features = ["std", "objc2", "CFArray"] }
objc2-core-graphics = { version = "0.3.2", default-features = false, optional = true, features = ["std", "objc2", "CGImage", "CGWindow"] }
# `file_panel` and `drop` only.
objc2-uniform-type-identifiers = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
# Tests read the running macOS version (`glass::running_macos_major`).
objc2-foundation = { workspace = true, features = ["NSProcessInfo"] }
