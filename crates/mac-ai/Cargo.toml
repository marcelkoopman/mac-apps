[package]
name = "mac-ai"
version = "0.1.0"
edition.workspace = true
license = "LicenseRef-Proprietary"
publish = false
build = "build.rs"
# Lets a dependent's build.rs see `DEP_MAC_AI_SWIFT_BRIDGE` (link args of a dependency's build
# script do not reach the final binary): copycraft's build.rs adds the Swift runtime rpath.
links = "mac_ai"

# No dependencies: a small Swift bridge around Apple's Foundation Models framework (on-device,
# offline) and a safe Rust API on top. All `unsafe` of the AI feature lives in this crate.
